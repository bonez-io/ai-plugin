# bonez MCP server for Codex, WITHOUT the plugin — paste into ~/.codex/config.toml
# ($HOME\.codex\config.toml on Windows), or <repo>/.codex/config.toml for one trusted project.
#
# The plugin is the way in: `codex plugin marketplace add bonez-io/ai-plugin`, then
# `codex plugin add bonez@bonez` (see the README). Use this file only for the server alone.
#
# Sign-in is OAuth. Codex asks only for OpenID scopes unless `scopes` is set, and its own
# client is not one every Bonez server's login knows, so the block pins the Bonez CLI app
# (the same client and callback the plugin's .mcp.json and cursor/mcp.json use).

# The URL below is Bonez's own cloud. For your own Bonez server (for example
# https://bonez.example.com), replace it with `https://<your server>/mcp`.
[mcp_servers.bonez]
url = "https://gateway.bonez.io/mcp"
scopes = ["bonez:read", "bonez:memory", "bonez:write"]

[mcp_servers.bonez.oauth]
client_id = "qFX0bzskdcDBhbJaBBwGoiLN5yWkBrMm"
callback_port = 8787
callback_url = "http://localhost:8787/callback"

# Then sign in: `codex mcp login bonez`; `codex mcp list` (or `/mcp` in the TUI) confirms it.

# --- Headless / CI: API key instead of OAuth (same lane as Claude Code) ---
# OAuth needs a browser. For CI runners and other headless contexts, have a
# Bonez admin of your server mint a key (console -> API keys), export it, and
# point Codex at the env var instead — do not paste the key into this file.
#
#   export BONEZ_API_KEY=bnz_...          (bash)
#   $env:BONEZ_API_KEY = "bnz_..."        (Windows PowerShell; start codex from that window)
#
# [mcp_servers.bonez]
# url = "https://gateway.bonez.io/mcp"
# bearer_token_env_var = "BONEZ_API_KEY"

# --- qa / local gateway ---
# Edit the `url` above directly — Codex does not expand ${VAR} shell syntax
# inside config.toml the way the Claude Code leg's .mcp.json does.
#   url = "https://qa.gateway.bonez.io/mcp"

# --- Optional: coarse write friction on graph_write/rules/vendor_operation (see README) ---
# Codex has no per-argument write gate (no equivalent of the Claude Code
# PreToolUse "ask" hook — see README). The closest native approximation
# prompts for EVERY call to a tool — every graph_write op is a write, but
# `rules` also prompts for harmless `list`/`get` reads, and `vendor_operation`
# (the tool lake: reads AND writes on the org's vendors, as you) prompts for
# every operation. No harness's plugin gate covers `vendor_operation`, and the
# server does not check the key's scope for it, so this is the only hard stop:
#
# [mcp_servers.bonez.tools.graph_write]
# approval_mode = "approve"
#
# [mcp_servers.bonez.tools.rules]
# approval_mode = "approve"
#
# [mcp_servers.bonez.tools.vendor_operation]
# approval_mode = "approve"

# --- Optional: session capture (off until you run `login` — see README) ---
# Mirrors the Claude Code leg's hooks/hooks.json SessionEnd hook: at the end
# of (and, via the SessionStart catch-up below, the start of) a session,
# hands the transcript to the SAME bin/bonez-session-sync.mjs the Claude
# Code leg uses, which is a silent no-op until you've run
# `bonez-session-sync.mjs login` once (browser sign-in — same GitHub/Google/
# bonez identity as the MCP server; `install <bnz_...key>` is the headless
# alternative). This block does nothing by itself even with `hooks = true`
# below and no login: consent is gated at BOTH layers on purpose.
#
# EDIT THE COMMAND PATH before enabling — Codex does not expand ${VAR} or
# ~ inside config.toml (same caveat as the `url` field above), so point it
# at wherever you placed this plugin's bin/bonez-session-sync.mjs, e.g. a
# checkout of bonez-io/ai-plugin:
#
#   command = "node /absolute/path/to/ai-plugin/bin/bonez-session-sync.mjs hook codex session-end"
#
# On Windows write the path with forward slashes, or as a TOML literal (single-quoted) string: a
# backslash inside a double-quoted TOML string starts an escape and the file stops parsing.
#
#   command = "node C:/Users/me/ai-plugin/bin/bonez-session-sync.mjs hook codex session-end"
#   command = 'node C:\Users\me\ai-plugin\bin\bonez-session-sync.mjs hook codex session-end'
#
# (How Codex starts a hook command on Windows has not been checked here.)
#
# Hooks are themselves opt-in per Codex install (off by default):
#
# [features]
# hooks = true
#
# SessionEnd: codex-rs hardcodes the matcher's `reason` to the literal
# string "other" regardless of why the session actually ended (verified
# against codex-rs/hooks/src/events/session_end.rs) — match on exactly
# that, not on the richer clear/resume/logout-style reasons Claude Code
# exposes. Codex caps SessionEnd at 1s default / 3s hard max inside a 5s
# teardown bound, well above what this hook needs (it detaches to a
# background process and returns immediately — see the README), but
# `timeout` is pinned to the hard max anyway as headroom.
#
# [[hooks.SessionEnd]]
# matcher = "other"
#
# [[hooks.SessionEnd.hooks]]
# type = "command"
# command = "node /absolute/path/to/ai-plugin/bin/bonez-session-sync.mjs hook codex session-end"
# timeout = 3
#
# SessionStart: transcript_path on SessionEnd is `Option<PathBuf>` and can
# be absent, and a session killed outright (crash, SIGKILL) never fires
# SessionEnd at all — so the following SessionStart is the durable
# fallback. It resolves the ENDED session from disk (session_id, walking
# ~/.codex/sessions/**) rather than trusting SessionEnd's payload, and
# flushes at most the one most-recently-modified not-yet-synced session —
# never the session that's just starting.
#
# [[hooks.SessionStart]]
# matcher = "startup|resume|clear|compact"
#
# [[hooks.SessionStart.hooks]]
# type = "command"
# command = "node /absolute/path/to/ai-plugin/bin/bonez-session-sync.mjs hook codex session-start"
# timeout = 5
