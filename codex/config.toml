# bonez MCP server for Codex, WITHOUT the plugin — paste into ~/.codex/config.toml
# ($HOME\.codex\config.toml on Windows), or <repo>/.codex/config.toml for one trusted project.
#
# The plugin is the way in: `codex plugin marketplace add bonez-io/ai-plugin`, then
# `codex plugin add bonez@bonez` (see the README). Use this file only for the server alone.
#
# Sign-in is OAuth. Codex asks only for OpenID scopes unless `scopes` is set, and its own
# client is not one every Bonez server's login knows, so the block pins the Bonez CLI app
# (the same client and callback the plugin's .mcp.json and cursor/mcp.json use).

# The URL below is Bonez's own cloud. For your own Bonez server (for example
# https://bonez.example.com), replace it with `https://<your server>/mcp`.
[mcp_servers.bonez]
url = "https://gateway.bonez.io/mcp"
scopes = ["bonez:read", "bonez:memory", "bonez:write"]

[mcp_servers.bonez.oauth]
client_id = "qFX0bzskdcDBhbJaBBwGoiLN5yWkBrMm"
callback_port = 8787
callback_url = "http://localhost:8787/callback"

# Then sign in: `codex mcp login bonez`; `codex mcp list` (or `/mcp` in the TUI) confirms it.

# --- Headless / CI: API key instead of OAuth (same lane as Claude Code) ---
# OAuth needs a browser. For CI runners and other headless contexts, have a
# Bonez admin of your server mint a key (console -> API keys), export it, and
# point Codex at the env var instead — do not paste the key into this file.
#
#   export BONEZ_API_KEY=bnz_...          (bash)
#   $env:BONEZ_API_KEY = "bnz_..."        (Windows PowerShell; start codex from that window)
#
# [mcp_servers.bonez]
# url = "https://gateway.bonez.io/mcp"
# bearer_token_env_var = "BONEZ_API_KEY"

# --- qa / local gateway ---
# Edit the `url` above directly — Codex does not expand ${VAR} shell syntax
# inside config.toml the way the Claude Code leg's .mcp.json does.
#   url = "https://qa.gateway.bonez.io/mcp"

# --- Write approval: ask before graph_write and rules (the plugin ships this; add it by hand here) ---
# The plugin's .mcp.json already sets these two, so a plugin install asks you before every
# graph_write and rules call. Pasting this file instead of installing the plugin does NOT carry
# them over: uncomment the first two stanzas to get the same prompts. Codex has no per-argument
# gate, so `rules` also asks for harmless `list`/`get` reads, which is the cost of a per-tool setting.
#
# approval_mode, per tool (or default_tools_approval_mode on the server):
#   auto    Codex decides (the default)
#   prompt  asks you before EVERY call to that tool          <- what you want here
#   writes  asks only for tools the server does not mark read-only
#   approve RUNS THE TOOL WITHOUT ASKING — never use it as a stop; it turns prompting off
#
# [mcp_servers.bonez.tools.graph_write]
# approval_mode = "prompt"
#
# [mcp_servers.bonez.tools.rules]
# approval_mode = "prompt"
#
# Optional hard stop for the tool lake: `vendor_operation` runs reads AND writes on the org's
# vendors as you, no harness's plugin gate covers it, and older servers do not check the key's
# scope for it, so this prompts on every operation, reads too.
#
# [mcp_servers.bonez.tools.vendor_operation]
# approval_mode = "prompt"

# The installed plugin bundles capture and recall hooks in hooks/hooks.json.
# Review the hooks in Codex. Transcript upload also requires the separate capture login.
