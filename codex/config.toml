# bonez MCP server for Codex — paste into ~/.codex/config.toml
# (or <repo>/.codex/config.toml for a trusted-project-only install).
#
# `auth` defaults to "oauth" when omitted, so this is the same no-key,
# browser-OAuth default install as the Claude Code leg: the first tool call
# 401s and Codex walks you through sign-in. Verified against the streamable
# HTTP `mcp_servers` config documented at
# https://developers.openai.com/codex/mcp — see the repo README's Codex
# section for what's confirmed vs assumed.

[mcp_servers.bonez]
url = "https://gateway.bonez.io/mcp"

# --- CLI equivalent of the block above ---
#   codex mcp add bonez --url https://gateway.bonez.io/mcp
#   codex mcp login bonez   # run the OAuth flow now instead of waiting for a 401
#   codex mcp list          # confirm it's there; `/mcp` inside the TUI does too

# --- Headless / CI: API key instead of OAuth (same lane as Claude Code) ---
# OAuth needs a browser. For CI runners and other headless contexts, mint a
# key in console.bonez.io under API keys, export it, and point Codex at the
# env var instead — do not paste the key into this file.
#
#   export BONEZ_API_KEY=bnz_...
#
# [mcp_servers.bonez]
# url = "https://gateway.bonez.io/mcp"
# bearer_token_env_var = "BONEZ_API_KEY"

# --- qa / local gateway ---
# Edit the `url` above directly — Codex does not expand ${VAR} shell syntax
# inside config.toml the way the Claude Code leg's .mcp.json does.
#   url = "https://qa.gateway.bonez.io/mcp"

# --- Optional: coarse write friction on memory/rules (see README) ---
# Codex has no per-argument write gate (no equivalent of the Claude Code
# PreToolUse "ask" hook — see README). The closest native approximation
# prompts for EVERY call to a tool, including harmless reads like `recall`
# or `list`/`get`, not just save/update/delete:
#
# [mcp_servers.bonez.tools.memory]
# approval_mode = "approve"
#
# [mcp_servers.bonez.tools.rules]
# approval_mode = "approve"

# --- Optional: session capture (off until you run `install` — see README) ---
# Mirrors the Claude Code leg's hooks/hooks.json SessionEnd hook: at the end
# of (and, via the SessionStart catch-up below, the start of) a session,
# hands the transcript to the SAME bin/bonez-session-sync.mjs the Claude
# Code leg uses, which is a silent no-op until you've run
# `bonez-session-sync.mjs install <bnz_...key>` once (mint a sessions-scoped
# key in console.bonez.io — scope = sessions). This block does nothing by
# itself even with `hooks = true` below and no install: consent is gated at
# BOTH layers on purpose.
#
# EDIT THE COMMAND PATH before enabling — Codex does not expand ${VAR} or
# ~ inside config.toml (same caveat as the `url` field above), so point it
# at wherever you placed this plugin's bin/bonez-session-sync.mjs, e.g. a
# checkout of bonez-io/ai-plugin:
#
#   command = "node /absolute/path/to/ai-plugin/bin/bonez-session-sync.mjs hook codex session-end"
#
# Hooks are themselves opt-in per Codex install (off by default):
#
# [features]
# hooks = true
#
# SessionEnd: codex-rs hardcodes the matcher's `reason` to the literal
# string "other" regardless of why the session actually ended (verified
# against codex-rs/hooks/src/events/session_end.rs) — match on exactly
# that, not on the richer clear/resume/logout-style reasons Claude Code
# exposes. Codex caps SessionEnd at 1s default / 3s hard max inside a 5s
# teardown bound, well above what this hook needs (it detaches to a
# background process and returns immediately — see the README), but
# `timeout` is pinned to the hard max anyway as headroom.
#
# [[hooks.SessionEnd]]
# matcher = "other"
#
# [[hooks.SessionEnd.hooks]]
# type = "command"
# command = "node /absolute/path/to/ai-plugin/bin/bonez-session-sync.mjs hook codex session-end"
# timeout = 3
#
# SessionStart: transcript_path on SessionEnd is `Option<PathBuf>` and can
# be absent, and a session killed outright (crash, SIGKILL) never fires
# SessionEnd at all — so the following SessionStart is the durable
# fallback. It resolves the ENDED session from disk (session_id, walking
# ~/.codex/sessions/**) rather than trusting SessionEnd's payload, and
# flushes at most the one most-recently-modified not-yet-synced session —
# never the session that's just starting.
#
# [[hooks.SessionStart]]
# matcher = "startup|resume|clear|compact"
#
# [[hooks.SessionStart.hooks]]
# type = "command"
# command = "node /absolute/path/to/ai-plugin/bin/bonez-session-sync.mjs hook codex session-start"
# timeout = 5
