name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JSON validity of all manifests
        run: |
          set -euo pipefail
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json server.json hooks/hooks.json cursor/mcp.json cursor/hooks/hooks.json cursor/.cursor-plugin/plugin.json .cursor-plugin/marketplace.json; do
            jq empty "$f"
            echo "ok: $f"
          done

      - name: Version parity across manifests
        run: |
          set -euo pipefail
          plugin_version="$(jq -r '.version' .claude-plugin/plugin.json)"
          marketplace_version="$(jq -r '.plugins[] | select(.name == "bonez") | .version' .claude-plugin/marketplace.json)"
          server_version="$(jq -r '.version' server.json)"
          echo "plugin.json:      $plugin_version"
          echo "marketplace.json: $marketplace_version"
          echo "server.json:      $server_version"
          if [ "$plugin_version" != "$marketplace_version" ] || [ "$plugin_version" != "$server_version" ]; then
            echo "::error::Version drift between manifests — one version, everywhere (see PostHog's 1.1.58/1.0.56/1.1.52/1.0.54 drift for why)."
            exit 1
          fi

      - name: Hook scripts parse (bash -n)
        run: |
          set -euo pipefail
          for f in hooks/*.sh tests/*.sh cursor/hooks/*.sh; do
            bash -n "$f"
            echo "ok: $f"
          done

      - name: Write gate tests
        run: ./tests/test_gate.sh

      - name: bonez-session-sync.mjs syntax + vendored bundle
        run: |
          set -euo pipefail
          for f in bin/*.mjs bin/vendor/*.mjs cursor/bin/*.mjs cursor/bin/vendor/*.mjs tests/*.mjs tests/lib/*.mjs; do
            node --check "$f"
            echo "ok: $f"
          done

      - name: Session capture tests
        run: ./tests/test_session_sync.sh

      - name: Skills parity across harness legs
        run: |
          set -euo pipefail
          # All three legs must expose the SAME SET of skills. Cursor's copy is
          # byte-identical to the canonical one — its write gate works, so the
          # Claude wording ("expect the harness to ask") is true there. Codex
          # deliberately forks two files because it has NO write gate and that
          # same wording would be a lie; anything beyond those two is drift.
          for leg in codex cursor; do
            diff <(ls skills) <(ls "$leg/skills") || {
              echo "::error::skills/ and $leg/skills/ expose different skill sets."; exit 1; }
          done
          if ! diff -r skills cursor/skills; then
            echo "::error::cursor/skills has drifted — re-copy it (rm -rf cursor/skills && cp -R skills cursor/skills)."
            exit 1
          fi
          expected="remembering reviewing-with-org-rules"
          actual="$(for d in $(ls skills); do
            cmp -s "skills/$d/SKILL.md" "codex/skills/$d/SKILL.md" || echo "$d"
          done | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::codex/skills divergence changed."
            echo "  expected exactly: $expected"
            echo "  found:            $actual"
            exit 1
          fi
          echo "ok: skill sets match; cursor/skills identical; codex divergence is the documented pair"

      - name: Cursor plugin structure
        run: |
          set -euo pipefail
          # Cursor discovers a plugin's parts at DEFAULT paths relative to the
          # plugin root (docs: Plugins). If one is missing or misplaced the
          # plugin still installs and simply does nothing — silent, which is the
          # failure mode worth a CI gate.
          test -f cursor/.cursor-plugin/plugin.json || { echo "::error::cursor manifest missing"; exit 1; }
          test -f cursor/mcp.json                   || { echo "::error::cursor/mcp.json missing"; exit 1; }
          test -f cursor/hooks/hooks.json           || { echo "::error::cursor/hooks/hooks.json missing"; exit 1; }
          test -x cursor/hooks/gate-write.sh        || { echo "::error::cursor gate not executable"; exit 1; }
          # The plugin must be SELF-CONTAINED. A marketplace install copies the
          # plugin directory on its own — there is no parent repo behind it — so
          # the gate cannot be a shim reaching ../../hooks/. It is a byte copy,
          # pinned here, because a gate that fails to exec is a gate that lets
          # writes through (Cursor fails open by default).
          cmp -s hooks/gate-write.sh cursor/hooks/gate-write.sh || {
            echo "::error::cursor/hooks/gate-write.sh has drifted from hooks/gate-write.sh — re-copy it."; exit 1; }
          test -d cursor/skills                     || { echo "::error::cursor/skills missing"; exit 1; }
          test -d cursor/commands                   || { echo "::error::cursor/commands missing"; exit 1; }

          # The marketplace entry must point at a plugin that actually exists.
          src="$(jq -r '.plugins[] | select(.name=="bonez") | .source' .cursor-plugin/marketplace.json)"
          test -f "$src/.cursor-plugin/plugin.json" || { echo "::error::marketplace source $src has no manifest"; exit 1; }

          # Version parity extends to the Cursor manifests.
          v="$(jq -r '.version' .claude-plugin/plugin.json)"
          [ "$(jq -r '.version' cursor/.cursor-plugin/plugin.json)" = "$v" ] \
            || { echo "::error::cursor plugin.json version != $v"; exit 1; }
          [ "$(jq -r '.metadata.version' .cursor-plugin/marketplace.json)" = "$v" ] \
            || { echo "::error::cursor marketplace version != $v"; exit 1; }

          # The hook command is resolved from the plugin root — prove it runs and
          # that the shim reaches the shared gate.
          # Run it the way a real install runs it: the plugin directory COPIED
          # somewhere else entirely, with no repo above it. Testing in-tree would
          # pass even for a plugin that only works in-tree.
          standalone="$(mktemp -d)/bonez"
          cp -R cursor "$standalone"
          out="$(cd "$standalone" && printf '%s' '{"hook_event_name":"beforeMCPExecution","tool_name":"memory","tool_input":"{\"op\":\"save\"}","url":"https://gateway.bonez.io/mcp"}' | ./hooks/gate-write.sh)"
          echo "$out" | grep -q '"permission":"ask"' || {
            echo "::error::the plugin is not self-contained — the gate did not fire from a standalone copy"; exit 1; }
          echo "ok: gate fires from a standalone plugin copy"

          # Session capture, same self-containment trap as the gate. The Cursor leg
          # runs the SAME bin/bonez-session-sync.mjs as the Claude Code and Codex
          # legs, so the plugin must carry its own byte copy of it (and of the
          # vendored bundle it imports) — a marketplace install has no parent repo
          # to reach into.
          test -x cursor/hooks/session-sync.sh || { echo "::error::cursor session-sync hook not executable"; exit 1; }
          # One wrapper serves every lifecycle event, with the event as its argument — so
          # every registered command must actually point at it.
          for ev in stop sessionEnd sessionStart; do
            jq -e --arg ev "$ev" '[.hooks[$ev][].command] | any(contains("hooks/session-sync.sh"))' \
              cursor/hooks/hooks.json >/dev/null \
              || { echo "::error::cursor hooks.$ev must call hooks/session-sync.sh"; exit 1; }
          done
          # `stop` is the one hook Cursor runs from the WORKSPACE root rather than the plugin
          # root (observed: exit code 127, "Running script in directory: <workspace>"), so a
          # bare relative command cannot find the script. It needs a plugin-root-anchored
          # form; the relative one stays alongside as the fallback for the case where the
          # cwd IS the plugin root. Losing the anchored entry silently disables per-turn
          # capture — the exact regression this check exists to catch.
          jq -e '[.hooks.stop[].command] | any(contains("PLUGIN_ROOT"))' cursor/hooks/hooks.json >/dev/null \
            || { echo "::error::cursor hooks.stop needs a \${CLAUDE_PLUGIN_ROOT}-anchored command — Cursor runs stop from the workspace, not the plugin root"; exit 1; }
          for f in bonez-session-sync.mjs vendor/agent-import.bundle.mjs; do
            test -f "cursor/bin/$f" || { echo "::error::cursor/bin/$f missing"; exit 1; }
            cmp -s "bin/$f" "cursor/bin/$f" || {
              echo "::error::cursor/bin/$f has drifted from bin/$f — re-copy it (cp bin/$f cursor/bin/$f)."; exit 1; }
          done
          jq -e '.hooks.sessionEnd | length >= 1' cursor/hooks/hooks.json >/dev/null \
            || { echo "::error::cursor/hooks/hooks.json does not register a sessionEnd hook — no session capture"; exit 1; }
          # sessionStart is NOT optional on the Cursor leg. Cursor 3.18.25 tears down
          # shell-exec before running sessionEnd hooks on window_close ("MainThreadShellExec
          # not initialized"), so quitting the app captures nothing. The start-side catch-up
          # is what makes capture survive that — losing it silently halves the feature.
          jq -e '.hooks.sessionStart | length >= 1' cursor/hooks/hooks.json >/dev/null \
            || { echo "::error::cursor/hooks/hooks.json does not register a sessionStart hook — capture will not survive window_close"; exit 1; }
          # `stop` is the PRIMARY capture trigger on Cursor — it is the only one that fires
          # while the window is alive, once per turn, independently per conversation.
          # sessionEnd cannot run on window_close and sessionStart serialises everything
          # through one catch-up. Losing this silently reverts capture to batch-with-lag.
          jq -e '.hooks.stop | length >= 1' cursor/hooks/hooks.json >/dev/null \
            || { echo "::error::cursor/hooks/hooks.json does not register a stop hook — capture loses per-turn and per-conversation coverage"; exit 1; }
          # Prove the wrapper resolves the .mjs from ITS OWN directory rather than
          # the checkout it was authored in. BONEZ_NODE stands in for node and just
          # records the path it was handed; the wrapper discards stdout, so the
          # stub writes to a file instead of printing.
          probe="$(mktemp -d)"
          printf '#!/usr/bin/env bash\necho "$1" > %s/resolved\n' "$probe" > "$probe/fake-node"
          chmod +x "$probe/fake-node"
          ( cd "$standalone" && printf '%s' '{"hook_event_name":"sessionEnd","conversation_id":"x"}' \
              | BONEZ_NODE="$probe/fake-node" ./hooks/session-sync.sh )
          resolved="$(cat "$probe/resolved" 2>/dev/null || true)"
          case "$resolved" in
            "$standalone"/*/bonez-session-sync.mjs|"$standalone"/bin/bonez-session-sync.mjs) ;;
            *) echo "::error::session-sync hook resolved to '$resolved', not the standalone copy at $standalone/bin/"; exit 1 ;;
          esac
          test -f "$resolved" || { echo "::error::session-sync hook pointed at a nonexistent file: $resolved"; exit 1; }
          echo "ok: session capture is self-contained in a standalone plugin copy"

          # Branding. The Cursor manifest's `logo` is plugin-relative, so the
          # asset has to live INSIDE the plugin or the marketplace card renders
          # blank — the same self-containment trap as the gate.
          logo="$(jq -r '.logo // empty' cursor/.cursor-plugin/plugin.json)"
          test -n "$logo" || { echo "::error::cursor plugin.json has no logo"; exit 1; }
          test -f "cursor/$logo" || { echo "::error::cursor/$logo missing"; exit 1; }
          cmp -s assets/logo.svg "cursor/$logo" || {
            echo "::error::cursor/$logo has drifted from assets/logo.svg"; exit 1; }
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse(sys.argv[1])" "cursor/$logo"
          # A logo with a fixed width/height renders at THAT size in a marketplace
          # card sized for ~128 and reads as missing. Every logo that actually
          # renders (cursor/plugin-template, published plugins) ships viewBox only.
          if grep -qE '<svg[^>]*\b(width|height)=' "cursor/$logo"; then
            echo "::error::cursor/$logo pins width/height — ship viewBox only or the card renders it tiny."
            exit 1
          fi
          vb="$(sed -n 's/.*viewBox="0 0 \([0-9.]*\) \([0-9.]*\)".*/\1 \2/p' "cursor/$logo" | head -1)"
          test -n "$vb" || { echo "::error::cursor/$logo has no 0-origin viewBox"; exit 1; }
          [ "${vb% *}" = "${vb#* }" ] || {
            echo "::error::cursor/$logo viewBox is not square ($vb) — a marketplace card will letterbox it"; exit 1; }

          # The marketplace CARD reads its logo from the marketplace ENTRY, not from
          # the plugin manifest — declaring it only in plugin.json leaves a generic
          # package placeholder in the listing (observed 2026-09-01; gitroomhq/postiz-agent
          # sets it in both). And since the entry's `source` is ./cursor, a relative
          # logo path could plausibly resolve from EITHER the marketplace root or the
          # plugin source, so the asset must exist at both and be identical.
          mlogo="$(jq -r '.plugins[] | select(.name=="bonez") | .logo // empty' .cursor-plugin/marketplace.json)"
          test -n "$mlogo" || { echo "::error::marketplace entry has no logo — the card will show a placeholder"; exit 1; }
          test -f "$mlogo" || { echo "::error::$mlogo missing (marketplace-root relative)"; exit 1; }
          test -f "cursor/$mlogo" || { echo "::error::cursor/$mlogo missing (plugin-source relative)"; exit 1; }
          cmp -s "$mlogo" "cursor/$mlogo" || { echo "::error::the two logo copies differ"; exit 1; }
          echo "ok: marketplace entry logo resolves from both roots"

          # OAuth is pinned to the Bonez CLI application rather than left to dynamic
          # registration. DCR is enabled on the tenant, but it creates THIRD-PARTY
          # clients and that quota is already spent by the two Claude Code and Codex
          # clients registered earlier (tpc_* in the Auth0 app list) — a third
          # registration returns 403 "reached the limit of entities of this type",
          # and Cursor then shows an Authenticate button that does nothing at all.
          # Pinning a first-party client sidesteps the quota entirely.
          jq -e '.mcpServers.bonez.auth.CLIENT_ID | type == "string" and length > 0' cursor/mcp.json >/dev/null \
            || { echo "::error::cursor/mcp.json needs auth.CLIENT_ID (third-party DCR quota is full)"; exit 1; }
          # The url must also be literal: Cursor expands neither ${VAR} nor ~, and the
          # Claude leg's .mcp.json uses ${BONEZ_MCP_URL:-...} which would leave no
          # reachable server here at all.
          url="$(jq -r '.mcpServers.bonez.url' cursor/mcp.json)"
          case "$url" in
            https://*) ;;
            *) echo "::error::cursor/mcp.json url must be a literal https URL, got: $url"; exit 1 ;;
          esac
          case "$url" in
            *'${'*|*'~'*) echo "::error::cursor/mcp.json url contains shell/tilde syntax Cursor will not expand: $url"; exit 1 ;;
          esac
          echo "ok: cursor mcp url is literal and OAuth client pinned"

          # The MCP registry takes icons by HTTPS URL, not a repo path, so the
          # only thing CI can assert is that they are well-formed and themed.
          jq -e '.icons | length >= 1' server.json >/dev/null || { echo "::error::server.json has no icons"; exit 1; }
          jq -e '(.icons | map(select(.src | startswith("https://"))) | length) == (.icons | length)' server.json >/dev/null \
            || { echo "::error::server.json icons must all be https"; exit 1; }
          echo "ok: logo present in plugin, icons declared for the registry"

          for f in cursor/commands/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error::$f missing frontmatter"; exit 1; }
            grep -q '^description:' "$f" || { echo "::error::$f missing description"; exit 1; }
          done
          echo "ok: cursor plugin structure, versions, and hook resolution"

      - name: Skill frontmatter sanity
        run: |
          set -euo pipefail
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error::$f missing frontmatter"; exit 1; }
            grep -q '^name:' "$f" || { echo "::error::$f missing name"; exit 1; }
            grep -q '^description:' "$f" || { echo "::error::$f missing description"; exit 1; }
            echo "ok: $f"
          done
