name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JSON validity of all manifests
        run: |
          set -euo pipefail
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json server.json hooks/hooks.json cursor/mcp.json cursor/hooks/hooks.json cursor/.cursor-plugin/plugin.json .cursor-plugin/marketplace.json; do
            jq empty "$f"
            echo "ok: $f"
          done

      - name: Version parity across manifests
        run: |
          set -euo pipefail
          plugin_version="$(jq -r '.version' .claude-plugin/plugin.json)"
          marketplace_version="$(jq -r '.plugins[] | select(.name == "bonez") | .version' .claude-plugin/marketplace.json)"
          server_version="$(jq -r '.version' server.json)"
          echo "plugin.json:      $plugin_version"
          echo "marketplace.json: $marketplace_version"
          echo "server.json:      $server_version"
          if [ "$plugin_version" != "$marketplace_version" ] || [ "$plugin_version" != "$server_version" ]; then
            echo "::error::Version drift between manifests — one version, everywhere (see PostHog's 1.1.58/1.0.56/1.1.52/1.0.54 drift for why)."
            exit 1
          fi

      - name: Hook scripts parse (bash -n)
        run: |
          set -euo pipefail
          for f in hooks/*.sh tests/*.sh; do
            bash -n "$f"
            echo "ok: $f"
          done

      - name: Write gate tests
        run: ./tests/test_gate.sh

      - name: bonez-session-sync.mjs syntax + vendored bundle
        run: |
          set -euo pipefail
          for f in bin/*.mjs bin/vendor/*.mjs tests/*.mjs tests/lib/*.mjs; do
            node --check "$f"
            echo "ok: $f"
          done

      - name: Session capture tests
        run: ./tests/test_session_sync.sh

      - name: Skills parity across harness legs
        run: |
          set -euo pipefail
          # All three legs must expose the SAME SET of skills. Cursor's copy is
          # byte-identical to the canonical one — its write gate works, so the
          # Claude wording ("expect the harness to ask") is true there. Codex
          # deliberately forks two files because it has NO write gate and that
          # same wording would be a lie; anything beyond those two is drift.
          for leg in codex cursor; do
            diff <(ls skills) <(ls "$leg/skills") || {
              echo "::error::skills/ and $leg/skills/ expose different skill sets."; exit 1; }
          done
          if ! diff -r skills cursor/skills; then
            echo "::error::cursor/skills has drifted — re-copy it (rm -rf cursor/skills && cp -R skills cursor/skills)."
            exit 1
          fi
          expected="remembering reviewing-with-org-rules"
          actual="$(for d in $(ls skills); do
            cmp -s "skills/$d/SKILL.md" "codex/skills/$d/SKILL.md" || echo "$d"
          done | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::codex/skills divergence changed."
            echo "  expected exactly: $expected"
            echo "  found:            $actual"
            exit 1
          fi
          echo "ok: skill sets match; cursor/skills identical; codex divergence is the documented pair"

      - name: Cursor plugin structure
        run: |
          set -euo pipefail
          # Cursor discovers a plugin's parts at DEFAULT paths relative to the
          # plugin root (docs: Plugins). If one is missing or misplaced the
          # plugin still installs and simply does nothing — silent, which is the
          # failure mode worth a CI gate.
          test -f cursor/.cursor-plugin/plugin.json || { echo "::error::cursor manifest missing"; exit 1; }
          test -f cursor/mcp.json                   || { echo "::error::cursor/mcp.json missing"; exit 1; }
          test -f cursor/hooks/hooks.json           || { echo "::error::cursor/hooks/hooks.json missing"; exit 1; }
          test -x cursor/hooks/gate-write.sh        || { echo "::error::cursor gate shim not executable"; exit 1; }
          test -d cursor/skills                     || { echo "::error::cursor/skills missing"; exit 1; }
          test -d cursor/commands                   || { echo "::error::cursor/commands missing"; exit 1; }

          # The marketplace entry must point at a plugin that actually exists.
          src="$(jq -r '.plugins[] | select(.name=="bonez") | .source' .cursor-plugin/marketplace.json)"
          test -f "$src/.cursor-plugin/plugin.json" || { echo "::error::marketplace source $src has no manifest"; exit 1; }

          # Version parity extends to the Cursor manifests.
          v="$(jq -r '.version' .claude-plugin/plugin.json)"
          [ "$(jq -r '.version' cursor/.cursor-plugin/plugin.json)" = "$v" ] \
            || { echo "::error::cursor plugin.json version != $v"; exit 1; }
          [ "$(jq -r '.metadata.version' .cursor-plugin/marketplace.json)" = "$v" ] \
            || { echo "::error::cursor marketplace version != $v"; exit 1; }

          # The hook command is resolved from the plugin root — prove it runs and
          # that the shim reaches the shared gate.
          out="$(cd cursor && printf '%s' '{"hook_event_name":"beforeMCPExecution","tool_name":"memory","tool_input":"{\"op\":\"save\"}","url":"https://gateway.bonez.io/mcp"}' | ./hooks/gate-write.sh)"
          echo "$out" | grep -q '"permission":"ask"' || { echo "::error::plugin-root hook path did not gate a write"; exit 1; }

          for f in cursor/commands/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error::$f missing frontmatter"; exit 1; }
            grep -q '^description:' "$f" || { echo "::error::$f missing description"; exit 1; }
          done
          echo "ok: cursor plugin structure, versions, and hook resolution"

      - name: Skill frontmatter sanity
        run: |
          set -euo pipefail
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error::$f missing frontmatter"; exit 1; }
            grep -q '^name:' "$f" || { echo "::error::$f missing name"; exit 1; }
            grep -q '^description:' "$f" || { echo "::error::$f missing description"; exit 1; }
            echo "ok: $f"
          done
