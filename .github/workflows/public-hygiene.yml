name: public-hygiene

# This repository is public. No secret, and no reference to Bonez's private side (issue-tracker ids, private
# repositories, customers, internal hosts, cloud accounts), may land in a file, a commit message or a pull
# request. scripts/check-public-hygiene.mjs holds the deny-list; .public-hygiene-allow the exceptions, with reasons.
# `edited` re-runs the checks when a pull request's title or body changes.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: No internal references in tracked files
        run: node scripts/check-public-hygiene.mjs
      - name: The check's own tests
        run: ./tests/test_public_hygiene.sh

  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The title and body come in through the environment, never spliced into the script.
      - name: No internal references in the title and body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.txt"
          node scripts/check-public-hygiene.mjs --text "$RUNNER_TEMP/pr.txt"
      - name: No internal references in the commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-public-hygiene.mjs --commits "$BASE..$HEAD"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Secret scan of the tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: Secret scan of the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="$BASE..$HEAD"
      - name: Secret scan of the pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="$BEFORE..$AFTER"
